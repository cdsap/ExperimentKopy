version: 2.1

on:
  pull_request:
    types: [opened, reopened]

jobs:
  build:
    docker:
      - image: cimg/android:2025.02
    environment:
      PR_CI_BUILD: true
    steps:
      - checkout
      - run:
          name: Build with Gradle
          command: |
            cat /proc/meminfo  
            ./gradlew assembleDebug
            cat /proc/meminfo
      - run: 
          command: journalctl -k
          when: always            

workflows:
  pr_build:
    jobs:
      - build